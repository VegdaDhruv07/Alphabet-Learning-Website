            🌟 Learn English Alphabets with Fun! 🌟

        <!-- Letter Input -->
        <div class="input-section">

            <label for="letter">Enter Letter</label>

            <div class="input-row">

                <input
                    type="text"
                    id="letter"
                    maxlength="1"
                    placeholder="A"
                >

                <button onclick="showLetter()">
                    Show 🚀

        <!-- Main Result -->
        <div class="result">

            </div>

            <h2 id="wordTitle">
                Enter a letter
            </h2>

            <button class="play-btn" onclick="speakWord()">
                🔊 Play
            </button>

        </div>


        <!-- 10 Words -->
        <div class="words-box">

            <h2>📚 10 Words</h2>

            <div id="wordList">
                Enter a letter to see 10 words.
            </div>

        </div>


        <div class="tip">
            💡 Learn one letter every day and become an English Star! ⭐

        function showLetter() {

            let letter = document
                .getElementById("letter")
                .value
                .toUpperCase();

            if (letter === "") {
                alert("Please enter a letter!");
                return;
            }

            if (!alphabetData[letter]) {
                alert("Please enter a letter from A to Z!");
                return;
            }

            let data = alphabetData[letter];

            document.getElementById("letterDisplay").textContent =
                letter + " " + data.emoji;

            document.getElementById("wordTitle").textContent =
                letter + " for " + data.main;


            let output = "";

            data.words.forEach(function(word, index) {

                output += `
                    <div class="word-item">
                        <span>${index + 1}. ${letter} for ${word}</span>

                        <button
                            class="small-play"
                            onclick="speak('${letter} for ${word}')">
                            🔊
                        </button>
                    </div>
                `;

            });

            document.getElementById("wordList").innerHTML = output;

        }


        function speakWord() {

            let title =
                document.getElementById("wordTitle").textContent;

            speak(title);

        }


        function speak(text) {

            window.speechSynthesis.cancel();

            let speech = new SpeechSynthesisUtterance(text);

            speech.lang = "en-US";
            speech.rate = 0.8;
            speech.pitch = 1;

            window.speechSynthesis.speak(speech);

        }


        // Press Enter to show letter
        document.getElementById("letter").addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    showLetter();
                }

            }
        );
